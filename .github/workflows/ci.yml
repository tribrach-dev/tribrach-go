name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Example (go vet with the analyzer, replay)
        working-directory: examples/counter
        run: |
          go build -o "$RUNNER_TEMP/tribrach-vet" github.com/tribrach-dev/tribrach-go/cmd/tribrach-vet
          go vet -vettool="$RUNNER_TEMP/tribrach-vet" ./...
          go test ./...
          go run github.com/tribrach-dev/tribrach-go/cmd/tribrach-go stamp -n

  conformance-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned core commit
        id: core
        run: echo "rev=$(cat conformance/testdata/CORE_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: tribrach-dev/tribrach
          ref: ${{ steps.core.outputs.rev }}
          path: core
      - name: The vendored cases match core
        run: diff -r core/tests/conformance conformance/testdata/core --exclude=README.md

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Commit $c has no Signed-off-by line"; missing=1
            fi
          done
          exit $missing
